<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 World Clock</h1>
            <p>Current Time in Different Time Zones</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search or add timezone..." class="search-box">
            <button id="addBtn" class="btn-add">+ Add Timezone</button>
        </div>

        <div class="clock-grid" id="clockGrid">
            <!-- Clock cards will be dynamically added here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
